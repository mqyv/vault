name: Sync with Equicord

# Prépare une mise à jour Equicord sur la branche `sync/equicord` (jamais directement sur main :
# du code externe non relu ne doit pas partir chez tous les utilisateurs via l updater).
# Si le merge a des conflits, le job échoue : résous-les en local puis ouvre une PR.

on:
  workflow_dispatch: {} # bouton « Run workflow » manuel sur GitHub

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream Equicord
    runs-on: ubuntu-latest
    # ne tourne que sur le fork, jamais sur Equicord lui-même
    if: github.repository != 'Equicord/Equicord'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "vault-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Equicord
        run: |
          git remote add upstream https://github.com/Equicord/Equicord.git
          git fetch upstream main

      - name: Merge (fast-forward-friendly)
        run: |
          # merge classique : l'historique n'avance que vers l'avant, donc les
          # utilisateurs peuvent toujours faire un pull en fast-forward.
          git merge --no-edit upstream/main

      - name: Push (branche de revue)
        run: git push --force-with-lease origin HEAD:refs/heads/sync/equicord
