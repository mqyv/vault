name: Sync with Equicord

# Garde Vault à jour avec Equicord (qui suit lui-même Vencord) : dès qu'Equicord publie un changement,
# il est fusionné dans main. Les utilisateurs le reçoivent ensuite via l'updater intégré.
#
#  1. fusion d'Equicord ; sur un conflit, la version d'Equicord l'emporte (le code upstream fait foi) ;
#  2. le rebranding « Equicord -> Vault » est réappliqué sur les lignes que la fusion a apportées ;
#  3. vérification que les personnalisations de Vault sont intactes (scripts/vaultSync.mjs check) ;
#  4. build, types, lint et patchs doivent passer ;
#  5. seulement alors, push sur main.
# Si une étape échoue, rien n'arrive sur main : le job passe en rouge (GitHub t'envoie un email) et le
# résultat est conservé sur la branche `sync/equicord` pour être corrigé à la main.
#
# Secret recommandé : SYNC_TOKEN (PAT fine-grained, Contents + Workflows en lecture/écriture).
# Sans lui, GitHub refuse de pousser une fusion qui modifie des fichiers .github/workflows d'Equicord.

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 heures
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream-v2
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream Equicord
    runs-on: ubuntu-latest
    # ne tourne que sur le fork, jamais sur Equicord lui-même
    if: github.repository != 'Equicord/Equicord'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "vault-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Equicord
        id: fetch
        run: |
          git remote add upstream https://github.com/Equicord/Equicord.git
          git fetch upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Vault a $behind commit(s) de retard sur Equicord."

      - name: Merge
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          # Workflows propres à Vault : le reste de .github/workflows vient d'Equicord et ne nous concerne pas.
          KEEP="autofix.yml installer.yml sync-upstream.yml test.yml"
          before=$(git rev-parse HEAD)

          # -X theirs : sur un conflit de lignes, la version d'Equicord l'emporte (le rebranding est réappliqué après).
          git merge --no-commit --no-ff -X theirs upstream/main || true

          # Fichiers supprimés d'un côté et modifiés de l'autre : on suit Equicord s'il a supprimé, sinon on garde le nôtre.
          for f in $(git diff --name-only --diff-filter=U); do
            if git cat-file -e "upstream/main:$f" 2>/dev/null; then git checkout --ours -- "$f" 2>/dev/null || git checkout --theirs -- "$f"; git add "$f"; else git rm -q -f "$f"; fi
          done

          # Nos fichiers, jamais ceux d'Equicord
          git checkout "$before" -- README.md 2>/dev/null || true
          for f in .github/workflows/*; do
            [ -e "$f" ] || continue
            echo " $KEEP " | grep -q " $(basename "$f") " || git rm -q -f "$f"
          done
          for k in $KEEP; do git checkout "$before" -- ".github/workflows/$k"; done

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Conflits non résolus :"; git diff --name-only --diff-filter=U
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/vaultSync.mjs rebrand "$before"
          node scripts/vaultSync.mjs fixpkg
          git add -A
          git commit -q -m "Merge Equicord upstream ($(git rev-parse --short upstream/main))"
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Check Vault customisations
        id: guard
        if: steps.merge.outputs.status == 'merged'
        run: node scripts/vaultSync.mjs check

      - name: Setup PNPM
        if: steps.merge.outputs.status == 'merged' && steps.guard.outcome == 'success'
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@v24
          require-lockfile: true

      - name: Test the merge
        id: test
        if: steps.merge.outputs.status == 'merged' && steps.guard.outcome == 'success'
        run: pnpm test && pnpm buildWeb && pnpm generatePluginJson > /dev/null

      - name: Refresh the website plugin catalogue
        id: catalogue
        if: steps.test.outcome == 'success'
        run: |
          pnpm generateSitePlugins
          if ! git diff --quiet -- site/plugins.json; then
            git add site/plugins.json
            git commit -q -m "Site: refresh plugin catalogue"
          fi

      - name: Push to main
        id: push
        if: steps.test.outcome == 'success'
        env:
          PAT: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$PAT" ]; then
            git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            git push origin HEAD:main
          fi

      - name: Keep the result for review
        if: failure() && steps.merge.outputs.status == 'merged'
        env:
          PAT: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$PAT" ]; then url="https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git"; else url=origin; fi
          git push --force "$url" HEAD:refs/heads/sync/equicord || echo "Impossible de pousser la branche de revue (fichiers .github/workflows modifiés ? ajoute le secret SYNC_TOKEN)."
          {
            echo "### Synchro Equicord à régler à la main"
            echo "La fusion a été préparée mais n'a pas été poussée sur \`main\`. Elle est sur la branche \`sync/equicord\` (si le push a réussi)."
            echo "Regarde l'étape en échec ci-dessus : personnalisation perdue, test en échec, ou push refusé."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on unresolved conflicts
        if: steps.merge.outputs.status == 'conflict'
        run: |
          echo "### Conflits que la synchro ne sait pas résoudre seule" >> "$GITHUB_STEP_SUMMARY"
          echo "Résous-les en local : git fetch upstream && git merge upstream/main" >> "$GITHUB_STEP_SUMMARY"
          exit 1
