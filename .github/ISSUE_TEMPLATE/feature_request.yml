name: Idée
description: Proposer une fonctionnalité ou un plugin pour Vault.
labels: [enhancement]
title: "[Idée] <titre>"

body:
    - type: textarea
      id: feature-description
      attributes:
          label: Quelle est votre idée ?
          description: Ce que ça ferait et à quoi ça vous servirait.
      validations:
          required: true

    - type: textarea
      id: implementation-notes
      attributes:
          label: Pistes techniques
          description: Si vous avez une idée de la façon de le faire.
      validations:
          required: false

    - type: textarea
      id: additional-context
      attributes:
          label: Contexte
          description: Captures d'écran, maquettes, exemples d'autres applications.
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Vérifications
          options:
              - label: J'ai vérifié que cette idée n'a pas déjà été proposée
                required: true
              - label: Je peux m'en occuper moi-même
