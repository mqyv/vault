name: Bug ou plantage
description: Signaler un bug ou un plantage de Vault.
labels: [bug]
title: "[Bug] <titre>"

body:
    - type: textarea
      id: bug-description
      attributes:
          label: Que se passe-t-il ?
          description: Où et quand le bug ou le plantage se produit, et quel plugin est concerné.
          placeholder: Quand je fais ..., le plugin ... ne fonctionne plus et ...
      validations:
          required: true

    - type: textarea
      id: expected-behaviour
      attributes:
          label: Que devrait-il se passer ?
          placeholder: Discord devrait ouvrir la page ... au lieu de ...
      validations:
          required: true

    - type: textarea
      id: steps-to-take
      attributes:
          label: Comment reproduire le problème ?
          placeholder: |
              1. Faire ...
              2. Puis ...
              3. Observer le bug
      validations:
          required: true

    - type: dropdown
      id: platform
      attributes:
          label: Système
          options:
              - Windows
              - macOS
      validations:
          required: true

    - type: textarea
      id: crash-log
      attributes:
          label: Erreurs
          description: Ouvrez la console avec `Ctrl+Shift+i` / `Cmd+Option+i`, puis collez les erreurs en rouge entre les "```". Ignorez les erreurs réseau comme « Failed to load resource ». Si l'installation a échoué, joignez le journal `vault-install.log`.
          value: |
              ```
              Remplacez ce texte par les erreurs.
              ```
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Vérifications
          options:
              - label: J'ai vérifié que ce bug n'a pas déjà été signalé
                required: true
              - label: Je peux proposer un correctif moi-même
