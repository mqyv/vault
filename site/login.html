<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Vault</title>
  <meta name="description" content="Entre ta clé d'accès pour rejoindre Vault.">
  <meta name="theme-color" content="#040506">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23040506'/%3E%3Cpath d='M14 22 L50 82 L86 22' fill='none' stroke='%23ff6363' stroke-width='10.5'/%3E%3Cpath d='M30 22 L50 56 L70 22' fill='none' stroke='%23ff6363' stroke-width='10.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="nav" id="nav">
    <a class="brand" href="index.html" aria-label="Vault, retour à l'accueil">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 22 L50 82 L86 22" fill="none" stroke="#ff6363" stroke-width="10.5" stroke-miterlimit="10"/><path d="M30 22 L50 56 L70 22" fill="none" stroke="#ff6363" stroke-width="10.5" stroke-miterlimit="10"/></svg>
      Vault
    </a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a href="index.html#plugins">Plugins</a>
      <a href="index.html#fonctionnalites">Fonctionnalités</a>
      <a href="index.html#cle">Espace membres</a>
    </nav>
    <div class="nav-actions">
      <a class="btn btn-secondary" href="index.html">Accueil</a>
      <a class="btn btn-primary" href="#">Télécharger</a>
    </div>
  </header>

  <main class="login">
    <div class="blobs" aria-hidden="true">
      <div class="blob-wrap b1"><div class="blob"></div></div>
      <div class="blob-wrap b2"><div class="blob"></div></div>
      <div class="grain"></div>
    </div>

    <!-- ===== le robot ===== -->
    <div class="stage">
      <svg id="robot" viewBox="0 0 400 460" role="img" tabindex="0" aria-label="Robot Vault. Clique dessus pour le faire sauter.">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1e23"/><stop offset="1" stop-color="#0f1013"/></linearGradient>
          <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
          <clipPath id="screenClip"><rect x="128" y="96" width="144" height="84" rx="22"/></clipPath>
        </defs>

        <!-- sol et ombre -->
        <ellipse cx="200" cy="414" rx="170" ry="26" fill="url(#floorGlow)"/>
        <g id="shadow-loop"><g id="shadow"><ellipse cx="200" cy="414" rx="86" ry="11" fill="#000" opacity="0.85" filter="url(#soft)"/></g></g>

        <g id="float"><g id="fall"><g id="bot">

          <!-- antenne -->
          <line x1="200" y1="78" x2="200" y2="50" stroke="#9c9c9d" stroke-width="4" stroke-linecap="round"/>
          <circle id="halo" cx="200" cy="38" r="17" fill="#ff6363" opacity="0.28"/>
          <circle cx="200" cy="38" r="8.5" fill="#ff6363" filter="url(#glow)"/>

          <!-- jambes et pieds -->
          <rect x="156" y="332" width="22" height="28" rx="8" fill="#0d0e11" stroke="rgba(255,255,255,0.14)"/>
          <rect x="222" y="332" width="22" height="28" rx="8" fill="#0d0e11" stroke="rgba(255,255,255,0.14)"/>
          <rect x="142" y="352" width="50" height="24" rx="12" fill="url(#metal)" stroke="rgba(255,255,255,0.2)"/>
          <rect x="208" y="352" width="50" height="24" rx="12" fill="url(#metal)" stroke="rgba(255,255,255,0.2)"/>

          <!-- bras (derrière le corps) -->
          <g id="armL">
            <rect x="104" y="230" width="24" height="78" rx="12" fill="url(#metal)" stroke="rgba(255,255,255,0.2)"/>
            <circle cx="116" cy="312" r="13" fill="#15171b" stroke="rgba(255,255,255,0.2)"/>
          </g>
          <g id="armR">
            <rect x="272" y="230" width="24" height="78" rx="12" fill="url(#metal)" stroke="rgba(255,255,255,0.2)"/>
            <circle cx="284" cy="312" r="13" fill="#15171b" stroke="rgba(255,255,255,0.2)"/>
          </g>

          <!-- corps -->
          <rect x="128" y="212" width="144" height="126" rx="32" fill="url(#metal)" stroke="rgba(255,255,255,0.2)"/>
          <path d="M152 215 H248" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="176" cy="229" r="3" fill="#2a2b2d"/><circle cx="200" cy="229" r="3" fill="#ff6363" filter="url(#glow)"/><circle cx="224" cy="229" r="3" fill="#2a2b2d"/>
          <!-- serrure sur le torse : plus bas, pour que l'anse ouverte ne touche pas le voyant -->
          <g id="lock">
            <g id="shackle"><path d="M190 278 V269 a10 10 0 0 1 20 0 V278" fill="none" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round"/></g>
            <rect x="184" y="277" width="32" height="26" rx="7" fill="#e6e6e6"/>
            <circle cx="200" cy="288" r="3.8" fill="#454647"/><rect x="198.4" y="289" width="3.2" height="8" rx="1.6" fill="#454647"/>
          </g>

          <!-- cou et tête -->
          <rect x="184" y="198" width="32" height="18" rx="6" fill="#0c0d10" stroke="rgba(255,255,255,0.12)"/>
          <g id="head">
            <rect x="90" y="120" width="16" height="44" rx="8" fill="#15171b" stroke="rgba(255,255,255,0.2)"/>
            <rect x="294" y="120" width="16" height="44" rx="8" fill="#15171b" stroke="rgba(255,255,255,0.2)"/>
            <rect x="104" y="74" width="192" height="128" rx="38" fill="url(#metal)" stroke="rgba(255,255,255,0.2)"/>
            <path d="M136 77 H264" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/>
            <rect x="124" y="92" width="152" height="92" rx="26" fill="#000" stroke="rgba(255,255,255,0.08)"/>

            <!-- le visage glisse sur l'écran mais ne peut jamais en sortir : tout ce qui dépasse est coupé -->
            <g clip-path="url(#screenClip)"><g id="face">
              <!-- yeux -->
              <g id="eyes-normal" filter="url(#glow)"><rect x="156" y="118" width="24" height="34" rx="12" fill="#ff6363"/><rect x="220" y="118" width="24" height="34" rx="12" fill="#ff6363"/></g>
              <g id="eyes-angry" filter="url(#glow)" opacity="0" visibility="hidden"><path d="M152 124 L184 138 V148 Q184 153 179 153 H157 Q152 153 152 148 Z" fill="#ff6363"/><path d="M248 124 L216 138 V148 Q216 153 221 153 H243 Q248 153 248 148 Z" fill="#ff6363"/></g>
              <g id="eyes-happy" filter="url(#glow)" opacity="0" visibility="hidden" fill="none" stroke="#ff6363" stroke-width="7" stroke-linecap="round"><path d="M154 140 Q168 120 182 140"/><path d="M218 140 Q232 120 246 140"/></g>
              <g id="eyes-x" filter="url(#glow)" opacity="0" visibility="hidden" fill="none" stroke="#ff6363" stroke-width="6" stroke-linecap="round"><path d="M158 124 L180 146 M180 124 L158 146"/><path d="M220 124 L242 146 M242 124 L220 146"/></g>
              <!-- joues -->
              <g id="blush" opacity="0"><ellipse cx="146" cy="160" rx="10" ry="6" fill="#ff8fb3"/><ellipse cx="254" cy="160" rx="10" ry="6" fill="#ff8fb3"/></g>
              <!-- bouche -->
              <g id="mouth-neutral"><path d="M188 166 Q200 172 212 166" fill="none" stroke="#ff6363" stroke-width="4.5" stroke-linecap="round"/></g>
              <g id="mouth-smile" opacity="0" visibility="hidden"><path d="M182 160 Q200 180 218 160" fill="none" stroke="#ff6363" stroke-width="4.5" stroke-linecap="round"/></g>
              <g id="mouth-frown" opacity="0" visibility="hidden"><path d="M186 174 Q200 160 214 174" fill="none" stroke="#ff6363" stroke-width="4.5" stroke-linecap="round"/></g>
              <g id="mouth-o" opacity="0" visibility="hidden"><ellipse cx="200" cy="168" rx="6.5" ry="8.5" fill="none" stroke="#ff6363" stroke-width="4.5"/></g>
            </g></g>
          </g>

        </g></g></g>
      </svg>
    </div>

    <!-- ===== le formulaire ===== -->
    <section class="panel keycap" aria-labelledby="titre">
      <span class="label">Accès par clé</span>
      <h1 id="titre">Entre ta clé.</h1>
      <p>Ta clé t'a été envoyée en message privé quand ta demande a été acceptée.</p>

      <form id="form" novalidate>
        <div class="field" id="field">
          <label class="label" for="key">Clé d'accès</label>
          <input id="key" name="key" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="VAULT-XXXXXX-XXXXXX-XXXXXX-XXXXXX" aria-describedby="status">
        </div>
        <p class="status" id="status" role="status" aria-live="polite" hidden></p>
        <button class="btn btn-primary" type="submit">Entrer dans Vault</button>
      </form>

      <p class="help">Pas de clé ? <a href="https://discord.gg/q97W6EfMV6" target="_blank" rel="noopener">Rejoins le serveur Discord</a></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/robot.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
